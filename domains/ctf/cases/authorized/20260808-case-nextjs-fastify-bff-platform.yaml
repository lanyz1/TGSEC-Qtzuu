techniques_learned:
  - "Next.js + Fastify BFF 架构渗透完整流程：识别（turbopack + FST_ERR）→ BFF 枚举（Sec-Fetch-Dest 头）→ 密码注册绕 TG 收码 + Turnstile 打码 → 页面专属 chunk diff 挖接口 → REST 路径参数详情 → 权限模型九项验证"
  - "Sec-Fetch-Dest: empty 是 BFF 浏览器校验绕过关键头（Referer/Origin 无效）；枚举前必须带全头否则全 403 误报"
  - "2captcha TurnstileTaskProxyless 解 Cloudflare Turnstile（sitekey 0x4AAAA 前缀从 JS 提取）"
  - "平台有密码注册模式时优先走它，绕开 TG 验证码收码卡点"
  - "限速绕过测试法：先无伪造头打 2-3 次拿 429 基线（记录 x-ratelimit-* 头），再逐个伪造 X-Forwarded-For/X-Real-IP/True-Client-IP/CF-Connecting-IP 对照；伪造后不再 429 = 限速信任可伪造头。CF-Connecting-IP 伪造会被 CF 层 403 拦截（真源站头）"
  - "限速维度判定：同号换 IP 仍 429 = 号码/账号维度；同 IP 换号放行 = IP 维度；两者都可通过对照实验区分"
  - "修复验证闭环：对方按报告加固后逐项复测分层（匿名/登录态/接口面），记录 已修复/部分修复/未修复 三态，修复优先级按剩余影响排序"
  - "刷榜/数据伪造面排除：创建接口注入 stats/favoriteCount/viewCount 全被服务端重算忽略 = 统计字段只读，直接排除数据伪造面"
  - "表达式引擎注入面排除：白名单函数 + 步骤数上限 = 计算型引擎防 RCE 标配，测完即排除"
