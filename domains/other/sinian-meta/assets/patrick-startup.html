<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派大星 · 技能启动特效</title>
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #DB2777;
  --brand-soft: #FDF2F8;
  --brand-soft-strong: #FCE7F3;
  --brand-text: #831843;
  --brand-on: #FFFFFF;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #EC4899;
    --brand-soft: #3B0A2A;
    --brand-soft-strong: #5B1444;
    --brand-text: #FBCFE8;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  font: var(--weight-regular) var(--text-body) var(--font-sans);
  color: var(--text);
  padding: 24px;
}

.patrick-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  background: var(--surface);
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 340px;
  box-shadow: 0 2px 16px rgba(219, 39, 119, 0.08);
}
.patrick-header {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.patrick-header .badge {
  font: var(--weight-medium) var(--text-caption) var(--font-sans);
  color: var(--brand);
  background: var(--brand-soft);
  border: 1px solid var(--brand-soft-strong);
  border-radius: var(--radius-full);
  padding: 2px 12px;
  white-space: nowrap;
}
.patrick-header h3 {
  margin: 0;
  font: var(--weight-medium) var(--text-title) var(--font-sans);
  color: var(--text);
}
.patrick-stage {
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.patrick-svg {
  width: 100%;
  height: 100%;
}

/* Patrick body colors */
.pat-body { fill: #F4A0A0; }
.pat-body-dark { fill: #E88888; }
.pat-belly { fill: #FFB8B8; }
.pat-eye-white { fill: #FFFFFF; stroke: #2A1A1F; stroke-width: 1.8; }
.pat-pupil { fill: #1A1A1A; }
.pat-mouth { fill: #8B3A3A; stroke: #2A1A1F; stroke-width: 1.5; }
.pat-tooth { fill: #FFFFFF; stroke: #2A1A1F; stroke-width: 1; }
.pat-hat-yellow { fill: #FFD700; stroke: #2A1A1F; stroke-width: 1.5; }
.pat-hat-blue { fill: #4FC3F7; }
.pat-hat-red { fill: #E53935; }
.pat-brow { stroke: #2A1A1F; stroke-width: 1.5; stroke-linecap: round; fill: none; }
.pat-drool { fill: #B3D9FF; stroke: #7EC8E3; stroke-width: 1; opacity: 0.85; }
.pat-drool-highlight { fill: #E0F0FF; opacity: 0.6; }
.pat-shorts-green { fill: #66BB6A; stroke: #2A1A1F; stroke-width: 1.5; }

/* Animations */
.patrick-svg.entrance {
  animation: patDrop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.patrick-svg.idle {
  animation: patWobble 3s ease-in-out infinite;
}
.patrick-svg.celebrate {
  animation: patCelebrate 0.8s ease-in-out;
}
.pat-eye {
  transform-box: fill-box;
  transform-origin: center;
}
.pat-eye.blink {
  animation: patBlink 3.5s ease-in-out infinite;
}
.pat-drool-drop {
  transform-box: fill-box;
  transform-origin: top center;
}
.pat-drool-drop.drip {
  animation: droolDrip 2.2s ease-in infinite;
}
.pat-drool-drop.drip2 {
  animation: droolDrip 2.2s ease-in 1.1s infinite;
}
.pat-mouth.open {
  animation: mouthOpen 0.5s ease-out forwards;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--brand);
  border-radius: var(--radius-full);
}
.status-text {
  font: var(--weight-medium) var(--text-body) var(--font-sans);
  color: var(--text);
  min-height: 20px;
  text-align: center;
}
.status-ready { color: var(--brand); }
.replay-btn {
  font: var(--weight-medium) var(--text-body) var(--font-sans);
  color: var(--brand-on);
  background: var(--brand);
  border: none;
  border-radius: var(--radius);
  padding: 8px 20px;
  cursor: pointer;
}
.replay-btn:hover { filter: brightness(1.08); }
.replay-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .patrick-svg.entrance {
    animation: patDrop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .patrick-svg.idle {
    animation: patWobble 3s ease-in-out infinite;
  }
  .patrick-svg.celebrate {
    animation: patCelebrate 0.8s ease-in-out;
  }
  .pat-eye.blink {
    animation: patBlink 3.5s ease-in-out infinite;
  }
  .pat-drool-drop.drip {
    animation: droolDrip 2.2s ease-in infinite;
  }
  .pat-drool-drop.drip2 {
    animation: droolDrip 2.2s ease-in 1.1s infinite;
  }
  .progress-fill.run {
    transition: width 2.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
}
@keyframes patDrop {
  0% { transform: scale(0.2) translateY(-40px); opacity: 0; }
  60% { transform: scale(1.08) translateY(6px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
@keyframes patWobble {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}
@keyframes patCelebrate {
  0%, 100% { transform: scale(1) rotate(0); }
  25% { transform: scale(1.1) rotate(-5deg); }
  50% { transform: scale(0.95) rotate(4deg); }
  75% { transform: scale(1.06) rotate(-2deg); }
}
@keyframes patBlink {
  0%, 88%, 100% { transform: scaleY(1); }
  92% { transform: scaleY(0.08); }
}
@keyframes droolDrip {
  0% { transform: scaleY(0.3) translateY(0); opacity: 0.9; }
  30% { transform: scaleY(1) translateY(2px); opacity: 0.85; }
  70% { transform: scaleY(1.2) translateY(6px); opacity: 0.7; }
  100% { transform: scaleY(0.5) translateY(14px); opacity: 0; }
}
@keyframes mouthOpen {
  0% { transform: scaleY(0.5); }
  100% { transform: scaleY(1); }
}
</style>
</head>
<body>

<div class="patrick-card" id="patrick">
  <div class="patrick-header">
    <span class="badge">启动特效</span>
    <h3>派大星 · 技能启动</h3>
  </div>

  <div class="patrick-stage">
    <svg class="patrick-svg" id="pat-svg" viewBox="0 0 200 200" aria-label="流口水的派大星">

      <!-- Body: star shape -->
      <path class="pat-body" d="M100,20 L118,62 L162,60 L128,88 L140,132 L100,108 L60,132 L72,88 L38,60 L82,62 Z"/>
      <!-- Belly highlight -->
      <ellipse class="pat-belly" cx="100" cy="100" rx="22" ry="26" opacity="0.35"/>

      <!-- Green shorts at bottom -->
      <path class="pat-shorts-green" d="M72,125 Q100,140 128,125 L140,132 L60,132 Z"/>

      <!-- Hat: backwards baseball cap -->
      <g>
        <!-- Hat brim (back, red) -->
        <ellipse class="pat-hat-red" cx="62" cy="42" rx="18" ry="6" transform="rotate(-20 62 42)"/>
        <!-- Hat crown (yellow) -->
        <path class="pat-hat-yellow" d="M70,48 Q80,18 110,22 Q130,26 128,48 Q110,42 90,44 Z"/>
        <!-- Hat blue panel -->
        <ellipse class="pat-hat-blue" cx="100" cy="32" rx="18" ry="10"/>
      </g>

      <!-- Eyebrows (raised, silly) -->
      <line class="pat-brow" x1="72" y1="60" x2="86" y2="56"/>
      <line class="pat-brow" x1="114" y1="56" x2="128" y2="60"/>

      <!-- Eyes: big white circles with small pupils (classic Patrick look) -->
      <g class="pat-eye blink">
        <ellipse class="pat-eye-white" cx="82" cy="74" rx="16" ry="18"/>
        <circle class="pat-pupil" cx="86" cy="78" r="4.5"/>
      </g>
      <g class="pat-eye blink">
        <ellipse class="pat-eye-white" cx="118" cy="74" rx="16" ry="18"/>
        <circle class="pat-pupil" cx="122" cy="78" r="4.5"/>
      </g>

      <!-- Open mouth with tooth -->
      <g style="transform-origin: 100px 100px;">
        <ellipse class="pat-mouth" cx="100" cy="100" rx="22" ry="16"/>
        <!-- Single tooth -->
        <path class="pat-tooth" d="M92,90 L98,90 L97,100 L93,100 Z"/>
      </g>

      <!-- Drool drops -->
      <g>
        <path class="pat-drool-drop drip" d="M96,104 Q94,112 96,118 Q98,122 96,118 Q94,114 96,104 Z"/>
        <path class="pat-drool-drop drip2" d="M106,106 Q104,114 106,120 Q108,124 106,120 Q104,116 106,106 Z"/>
      </g>

      <!-- Cheek blush -->
      <ellipse cx="68" cy="92" rx="8" ry="5" fill="#FF7B9C" opacity="0.35"/>
      <ellipse cx="132" cy="92" rx="8" ry="5" fill="#FF7B9C" opacity="0.35"/>

    </svg>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="pat-fill"></div>
  </div>
  <div class="status-text" id="pat-status">派大星启动中...</div>
  <button class="replay-btn" id="pat-replay" type="button">重新启动</button>
</div>

<script>
(function () {
  var svg = document.getElementById('pat-svg');
  var fill = document.getElementById('pat-fill');
  var status = document.getElementById('pat-status');
  var btn = document.getElementById('pat-replay');
  var defaultQuotes = [
    '派大星启动中...',
    '哦？要启动技能了吗',
    '让我把知识装进脑子',
    '嗯...这个怎么用来着',
    '我准备好了！大概吧',
    '知识...涌进来啦！'
  ];
  var readyMsg = '✓ 技能加载完成 · 派大星就绪';
  var quotes = defaultQuotes.slice();
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = null, quoteTimer = null, idx = 0;
  var readyCbs = [];

  function clearTimers() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (quoteTimer) { clearInterval(quoteTimer); quoteTimer = null; }
  }

  function play() {
    clearTimers();
    fill.classList.remove('run');
    fill.style.width = '0%';
    status.classList.remove('status-ready');
    status.textContent = quotes[0];
    idx = 0;

    svg.classList.remove('entrance', 'idle', 'celebrate');
    void svg.getBoundingClientRect();
    svg.classList.add(prefersReduced ? 'idle' : 'entrance');

    requestAnimationFrame(function () {
      fill.classList.add('run');
      fill.style.width = '100%';
    });

    quoteTimer = setInterval(function () {
      idx = (idx + 1) % quotes.length;
      status.textContent = quotes[idx];
    }, 480);

    timer = setTimeout(function () {
      clearInterval(quoteTimer); quoteTimer = null;
      status.textContent = readyMsg;
      status.classList.add('status-ready');
      svg.classList.remove('entrance');
      if (!prefersReduced) {
        svg.classList.add('celebrate');
        setTimeout(function () {
          svg.classList.remove('celebrate');
          svg.classList.add('idle');
        }, 820);
      } else {
        svg.classList.add('idle');
      }
      readyCbs.forEach(function (cb) { try { cb(); } catch (e) {} });
    }, prefersReduced ? 400 : 2650);
  }

  btn.addEventListener('click', play);

  window.PatrickStartup = {
    play: play,
    setQuotes: function (q) { if (Array.isArray(q) && q.length) quotes = q.slice(); },
    setReadyMessage: function (m) { if (typeof m === 'string') readyMsg = m; },
    onReady: function (cb) { if (typeof cb === 'function') readyCbs.push(cb); }
  };

  play();
})();
</script>

</body>
</html>
