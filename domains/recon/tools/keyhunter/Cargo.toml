[package]
name = "github-keyhunter"
version = "0.1.0"
edition = "2021"
description = "Fast GitHub API key leak scanner"
license = "MIT"
authors = ["fadidevv"]
repository = "https://github.com/fadidevv/keyhunter"
keywords = ["security", "api-keys", "github", "ai", "secrets"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
colored = "2.1"
indicatif = { version = "0.17", features = ["rayon"] }
futures = "0.3"
anyhow = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
rand = "0.8"
lazy_static = "1.4"
urlencoding = "2.1"
ctrlc = "3.4"

[[bin]]
name = "keyhunter"
path = "src/main.rs"