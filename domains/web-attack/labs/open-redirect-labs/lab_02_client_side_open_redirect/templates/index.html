<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 02 - Client-Side Open Redirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-8">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Lab 02</h1>
      <p class="text-slate-600 mb-6">Basic Client-Side Open Redirect</p>
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-6">
        <p class="text-sm text-slate-600">
          This application uses JavaScript to determine where the browser should
          navigate.
        </p>
      </div>
      <a
        href="?next=/"
        class="inline-block bg-slate-800 text-white px-5 py-3 rounded-lg hover:bg-slate-700 transition"
      >
        Continue
      </a>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (next) {
        window.location.href = next;
      }
    </script>
  </body>
</html>
