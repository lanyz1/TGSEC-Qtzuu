<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflected XSS Lab</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <!-- Navbar -->
    <nav class="border-b border-white/10 bg-slate-950/70 backdrop-blur-xl">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4"
      >
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-violet-500/10 ring-1 ring-violet-400/20"
          >
            <span class="text-lg font-bold text-violet-400"> X </span>
          </div>
          <div>
            <p class="font-semibold tracking-wide">XSS Labs</p>
            <p class="text-xs text-slate-500">Web Security Training</p>
          </div>
        </div>
        <div class="hidden items-center gap-2 sm:flex">
          <span
            class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-3 py-1 text-xs font-medium text-emerald-400"
          >
            Local Lab
          </span>
          <span
            class="rounded-full border border-violet-400/20 bg-violet-400/10 px-3 py-1 text-xs font-medium text-violet-400"
          >
            Lab 01
          </span>
        </div>
      </div>
    </nav>

    <main class="mx-auto max-w-2xl px-6 py-20">
      <!-- Header -->
      <div class="mb-10 text-center">
        <h1 class="text-4xl font-bold">Reflected XSS Lab</h1>
        <p class="mt-3 text-slate-400">
          Find the vulnerability in the search functionality.
        </p>
      </div>

      <!-- Search -->
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
        <form method="GET" action="/" class="flex gap-3">
          <input
            type="text"
            name="q"
            placeholder="Search..."
            autocomplete="off"
            class="flex-1 rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none placeholder:text-slate-500 focus:border-violet-500"
          />
          <button
            type="submit"
            class="rounded-lg bg-violet-600 px-6 py-3 font-medium text-white hover:bg-violet-500"
          >
            Search
          </button>
        </form>

        <!-- Search Result -->
        {% if query %}
        <div class="mt-8 border-t border-slate-800 pt-6">
          <p class="mb-2 text-sm text-slate-500">Search results for:</p>
          {# INTENTIONALLY VULNERABLE (Jinja comment: not sent to the browser) #}
          <div class="text-lg text-white break-words">{{ query | safe }}</div>
        </div>
        {% endif %}
      </div>

      <!-- Lab Info -->
      <footer class="mt-8 text-center">
        <p class="mt-6 text-center text-xs text-slate-600">
          Educational lab • Run locally
        </p>
      </footer>
    </main>
  </body>
</html>
