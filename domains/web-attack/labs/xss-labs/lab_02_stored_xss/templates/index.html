<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stored XSS Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto max-w-2xl px-6 py-16">
      <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold">Stored XSS Lab</h1>
        <p class="mt-3 text-slate-400">Leave a message and see what happens.</p>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
        <form method="POST">
          <textarea
            name="message"
            rows="4"
            placeholder="Write a message..."
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none placeholder:text-slate-500 focus:border-violet-500"
          ></textarea>
          <button
            type="submit"
            class="mt-4 rounded-lg bg-violet-600 px-6 py-3 font-medium hover:bg-violet-500"
          >
            Post Message
          </button>
        </form>
        {% if messages %}
        <div class="mt-8 border-t border-slate-800 pt-6">
          <h2 class="mb-4 text-lg font-semibold">Messages</h2>
          <div class="space-y-3">
            {% for message in messages %}
            <!-- INTENTIONALLY VULNERABLE -->
            <div class="rounded-lg border border-slate-800 bg-slate-950 p-4">
              {{ message | safe }}
            </div>
            {% endfor %}
          </div>
        </div>
        {% endif %}
      </div>
      <p class="mt-6 text-center text-xs text-slate-600">
        Educational lab • Run locally
      </p>
    </main>
  </body>
</html>
