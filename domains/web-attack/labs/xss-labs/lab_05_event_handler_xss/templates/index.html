<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Handler XSS Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto max-w-2xl px-6 py-16">
      <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold">Event Handler XSS Lab</h1>
        <p class="mt-3 text-slate-400">
          Find the vulnerability inside a JavaScript event handler.
        </p>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
        <form method="GET" class="space-y-4">
          <label class="block text-sm text-slate-400"> Enter a message </label>
          <input
            type="text"
            name="message"
            placeholder="Your message..."
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none placeholder:text-slate-500 focus:border-violet-500"
          />
          <button
            type="submit"
            class="rounded-lg bg-violet-600 px-6 py-3 font-medium hover:bg-violet-500"
          >
            Submit
          </button>
        </form>
        <div class="mt-8 border-t border-slate-800 pt-6">
          <p class="mb-3 text-sm text-slate-400">Preview</p>
          <!-- INTENTIONALLY VULNERABLE -->
          <button
            type="button"
            onclick="showMessage('{{ message | safe }}')"
            class="rounded-lg border border-slate-700 bg-slate-950 px-5 py-3 hover:border-violet-500"
          >
            Show Message
          </button>
        </div>
      </div>
      <p class="mt-6 text-center text-xs text-slate-600">
        Educational lab • Run locally
      </p>
    </main>
    <script>
      function showMessage(message) {
        alert(message);
      }
    </script>
  </body>
</html>
