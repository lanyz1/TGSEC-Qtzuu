<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Context XSS Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto max-w-2xl px-6 py-16">
      <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold">JavaScript Context XSS Lab</h1>
        <p class="mt-3 text-slate-400">
          Find the vulnerability inside a JavaScript context.
        </p>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
        <p class="text-slate-400">
          The application uses your username inside JavaScript.
        </p>
        <div class="mt-6 rounded-lg border border-slate-800 bg-slate-950 p-4">
          <p class="text-sm text-slate-500">Current user</p>
          <p id="username" class="mt-1 text-lg">Loading...</p>
        </div>
      </div>
      <p class="mt-6 text-center text-xs text-slate-600">
        Educational lab • Run locally
      </p>
    </main>
    <script>
      const username = "{{ username | safe }}";
      document.getElementById("username").textContent = username;
    </script>
  </body>
</html>
