<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 11 - HTML Comment Context XSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-lg">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Lab 11</h1>
      <p class="text-slate-500 mb-6">HTML Comment Context</p>
      <form method="GET" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">
            Enter a comment
          </label>
          <input
            type="text"
            name="comment"
            value="{{ comment }}"
            placeholder="Write something..."
            class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-400"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-slate-800 text-white py-3 rounded-lg hover:bg-slate-700 transition"
        >
          Submit
        </button>
      </form>
      <div class="mt-6 p-4 bg-slate-50 rounded-lg">
        <p class="text-sm text-slate-500 mb-2">Status</p>
        <p class="text-slate-800">Your comment has been processed.</p>
      </div>
    </div>
    <!-- User comment starts here {{ comment | safe }} -->
  </body>
</html>
