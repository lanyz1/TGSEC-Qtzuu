<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 14 - iframe srcdoc XSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8">
      <h1 class="text-3xl font-bold text-slate-800 mb-3">Lab 14 - iframe srcdoc XSS</h1>
      <p class="text-slate-600 mb-6">iframe <code>srcdoc</code> Context</p>
      <form method="GET" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">
            Content
          </label>
          <input
            type="text"
            name="content"
            value="{{ content }}"
            placeholder="Enter content..."
            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-slate-800 text-white py-3 rounded-lg hover:bg-slate-700 transition"
        >
          Render Content
        </button>
      </form>
      <div class="mt-8">
        <h2 class="text-lg font-semibold text-slate-800 mb-3">Preview</h2>
        <iframe
          class="w-full h-48 border border-slate-300 rounded-lg"
          srcdoc="<p class='text-slate-700'>{{ content | safe }}</p>"
        ></iframe>
      </div>
    </div>
  </body>
</html>
