<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 15 - postMessage DOM XSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8">
      <h1 class="text-3xl font-bold text-slate-800 mb-3">Lab 15 - postMessage DOM XSS</h1>
      <p class="text-slate-600 mb-6">DOM XSS via <code>postMessage()</code></p>
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
        <p class="text-sm text-slate-500 mb-2">Received message:</p>
        <div id="result" class="text-slate-800">Waiting for a message...</div>
      </div>
    </div>
    <script>
      window.addEventListener("message", function (event) {
        const message = event.data;
        document.getElementById("result").innerHTML = message;
      });
    </script>
  </body>
</html>
