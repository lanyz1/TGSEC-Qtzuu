<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 18 - insertAdjacentHTML()</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-8">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Lab 18 - insertAdjacentHTML()</h1>
      <p class="text-slate-600 mb-6">DOM XSS via insertAdjacentHTML()</p>
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-6">
        <p class="text-sm text-slate-600">
          Enter a message in the URL using the
          <span class="font-mono text-slate-800">message</span>
          parameter.
        </p>
      </div>
      <div
        id="result"
        class="border border-slate-300 rounded-lg p-4 min-h-20 text-slate-700"
      >
        Waiting for your message...
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const message = params.get("message") || "Hello";
      const result = document.getElementById("result");
      result.insertAdjacentHTML("beforeend", "<p>" + message + "</p>");
    </script>
  </body>
</html>
