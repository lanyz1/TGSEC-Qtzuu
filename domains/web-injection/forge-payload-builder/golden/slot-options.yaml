  # =====================================================================
  # 以下两组（crlf / cors）是在本文件开始写之后才进 data/ 的槽位，
  # 一并补上——漏一个选项就是漏一个静默损坏的入口。
  # =====================================================================

  # ================= crlf.* · nl =================
  # 11 条 crlf 模板共用同一个 nl 槽位：seq 是「换行怎么表示」的五档。
  # 五档的差别全在**换行的字节**上，而它们在终端里长得一模一样——
  # 这是最典型的「打错一个字符也不会有测试红」的地方，所以逐档钉死。
  #   crlf → %0d%0a（明细文的百分号编码）  lf → %0a  cr → %0d
  #   raw  → 真正的 CR LF 两个字节        dbl → %250d%250a（双重编码）
  # raw 那档的期望值必须用双引号标量写 `\r\n`：YAML 里的转义才是真 CR/LF，
  # 而别处那几档里的 `%0d%0a` 是**十一个普通字符**，两者不能混。

  # ---- crlf.generic.probe.header ----

  - name: crlf.generic.probe.header · nl=crlf
    state:
      vuln: crlf
      template: crlf.generic.probe.header
      slots: {nl: crlf}
      outputs: [raw]
    expect:
      payload: "%0d%0aX-Crlf-Probe:%20injected"

  - name: crlf.generic.probe.header · nl=lf
    state:
      vuln: crlf
      template: crlf.generic.probe.header
      slots: {nl: lf}
      outputs: [raw]
    expect:
      payload: "%0aX-Crlf-Probe:%20injected"

  - name: crlf.generic.probe.header · nl=cr
    state:
      vuln: crlf
      template: crlf.generic.probe.header
      slots: {nl: cr}
      outputs: [raw]
    expect:
      # 只有 CR，没有 LF——部分实现把裸 CR 也当行结束
      payload: "%0dX-Crlf-Probe:%20injected"

  - name: crlf.generic.probe.header · nl=raw
    state:
      vuln: crlf
      template: crlf.generic.probe.header
      slots: {nl: raw}
      outputs: [raw]
    expect:
      # 真的 CR LF 两个字节，不是百分号编码 —— 期望值里 \r\n 是 YAML 转义
      payload: "\r\nX-Crlf-Probe:%20injected"

  - name: crlf.generic.probe.header · nl=dbl
    state:
      vuln: crlf
      template: crlf.generic.probe.header
      slots: {nl: dbl}
      outputs: [raw]
    expect:
      # %25 是 % 本身的双重编码，解码一次后才是 %0d%0a
      payload: "%250d%250aX-Crlf-Probe:%20injected"

  # ---- crlf.generic.probe.bare ----

  - name: crlf.generic.probe.bare · nl=crlf
    state:
      vuln: crlf
      template: crlf.generic.probe.bare
      slots: {nl: crlf}
      outputs: [raw]
    expect:
      payload: "%0d%0a"

  - name: crlf.generic.probe.bare · nl=lf
