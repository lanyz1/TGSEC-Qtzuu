      payload: "${7*'7'}"

  - name: ssti.generic.detect.str · d=erb
    state:
      vuln: ssti
      template: ssti.generic.detect.str
      slots: {d: erb}
      outputs: [raw]
    expect:
      payload: "<%=7*'7'%>"

  # ================= ssti.generic.detect.config · d =================
  # 只有两档——这个探测串在 ERB/Smarty 里语义不通，所以那几档没进选项。

  - name: ssti.generic.detect.config · d=jinja2
