      <stop offset="0.55" stop-color="#7ee7ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="16%" r="80%">
      <stop offset="0" stop-color="#101820" stop-opacity="1"/>
      <stop offset="1" stop-color="#07090d" stop-opacity="1"/>
    </radialGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
