<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">SecAtlas Penetration Testing Learning Library</title>
  <desc id="desc">Repository cover for Chinese network security and penetration testing learning materials.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.55" stop-color="#091827"/>
      <stop offset="1" stop-color="#0D2330"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(365 250) rotate(90) scale(255)">
      <stop offset="0" stop-color="#35D0E7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#35D0E7" stop-opacity="0"/>
