    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientTransform="translate(1430 70) rotate(128) scale(310)">
      <stop offset="0" stop-color="#D7B468" stop-opacity=".16"/>
      <stop offset="1" stop-color="#D7B468" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A8C6D1" stroke-opacity=".055"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
