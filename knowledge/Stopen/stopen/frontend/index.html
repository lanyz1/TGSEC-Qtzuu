<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopen — 自动化渗透测试 Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background 0.2s, color 0.2s;
    }
    body.light { background: #f4f5f7; color: #16181d; }
    body.dark { background: #0b0e13; color: #d5dae2; }
    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
      --radius: 5px;
      --radius-sm: 4px;
      --shadow: none;
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.35);
    }
    body.dark {
      --bg-primary: #0b0e13;
      --bg-card: #10141b;
      --bg-secondary: #0e1117;
      --bg-hover: #161b24;
      --bg-sidebar: #0d1016;
      --bg-terminal: #06080c;
      --border: #1d232e;
      --border-strong: #2a3240;
      --text: #d5dae2;
      --text-dim: #67717f;
      --text-faint: #4a525e;
      --accent: #2dd4bf;
      --accent-hover: #14b8a6;
      --accent-dim: rgba(45, 212, 191, 0.10);
      --accent-light: rgba(45, 212, 191, 0.10);
      --accent-text: #0b0e13;
      --success: #4ade80;
      --error: #f87171;
      --warning: #fbbf24;
      --info: #7dd3fc;
    }
    body.light {
      --bg-primary: #f4f5f7;
      --bg-card: #ffffff;
      --bg-secondary: #fafbfc;
      --bg-hover: #eef0f3;
      --bg-sidebar: #ffffff;
      --bg-terminal: #10141b;
      --border: #e2e5ea;
      --border-strong: #cdd2da;
      --text: #16181d;
      --text-dim: #6a7280;
      --text-faint: #9aa2ad;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-dim: rgba(13, 148, 136, 0.08);
      --accent-light: rgba(13, 148, 136, 0.08);
      --accent-text: #ffffff;
      --success: #16a34a;
      --error: #dc2626;
      --warning: #d97706;
      --info: #0284c7;
    }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    a { color: var(--accent); text-decoration: none; }
    input, select, textarea, button { font-family: var(--font); }
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none; border-color: var(--accent) !important;
    }
  </style>
</head>
<body class="dark">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
